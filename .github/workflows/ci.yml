name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

jobs:
  local-alpha:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.8.18"
          python-version: "3.12"
          enable-cache: false

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.8.0"

      - name: Install pnpm
        run: npm install --global pnpm@11.6.0

      - name: Check public source and contracts
        run: make check PYTHON_VERSION=3.12

      - name: Run offline Local Alpha
        run: make demo PYTHON_VERSION=3.12 STATE_DIR="${RUNNER_TEMP}/symphlo-demo"
